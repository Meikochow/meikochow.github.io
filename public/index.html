  <style>
  body{
    background-color: #000;
  }
  #loading{
    border-radius:50%;
    padding:40px;
    margin:30vh auto 0px auto;
    transform: opacity 0.5s ease-in-out;
    
  }
    #loader{
      margin:0px auto 0px auto;
      display:block;
      animation: spin 1.6s cubic-bezier(.36,.07,.19,.97) infinite, wink 1.6s infinite;;
      transform: translate3d(0, 0, 0);
      mix-blend-mode: difference;
      fill: #fff
    }
    @keyframes spin {
      0% {
        transform: rotateZ(0deg) scale(1);
      }
      20%{
        transform:rotate(-360deg) scale(3);
      }
      60%{
        transform:rotate(360deg) scale(2);
      }
      100%{
        transform:rotate(0deg) scale(1);
      }
    }
    @keyframes wink {
      /* 0%: Starts as clean, steady white */
      0% {
        fill: #ffffff;
        filter: drop-shadow(0 0 40px rgba(255, 255, 255, 0.5));
      }

      /* 10%: Electric Plasma Cyan */
      10% {
        fill: #00f0ff;
        filter: drop-shadow(0 0 80px #00f0ff) drop-shadow(0 0 200px #00f0ff);
      }

      /* 20%: Vivid Laser Purple */
      20% {
        fill: #bd00ff;
        filter: drop-shadow(0 0 80px #bd00ff) drop-shadow(0 0 200px #bd00ff);
      }

      /* 30%: Radioactive Lime Green */
      30% {
        fill: #39ff14;
        filter: drop-shadow(0 0 8px #39ff14) drop-shadow(0 0 200px #39ff14);
      }

      /* 40%: Hot Cyber Magenta */
      40% {
        fill: #ff007f;
        filter: drop-shadow(0 0 80px #ff007f) drop-shadow(0 0 250px #ff007f);
      }

      /* 50%: Acid Tangerine / Safety Orange */
      50% {
        fill: #fcfcfc;
        filter: drop-shadow(0 0 80px #ff5e00) drop-shadow(0 0 200px #ff5e00);
      }

      /* 60%: Hyper Canary Yellow */
      60% {
        fill: #ffe600;
        filter: drop-shadow(0 0 80px #ffe600) drop-shadow(0 0 200px #ffe600);
      }

      /* 70%: Psycho Electric Pink */
      70% {
        fill: #ff00ff;
        filter: drop-shadow(0 0 80px #ff00ff) drop-shadow(0 0 200px #ff00ff);
      }

      /* 80%: Mint Ice / Alien Turquoise */
      80% {
        fill: #00ffaa;
        filter: drop-shadow(0 0 80px #00ffaa) drop-shadow(0 0 200px #00ffaa);
      }

      /* 90%: Deep Electric Blue (Kept bright enough to pop) */
      90% {
        fill: #1a55ff;
        filter: drop-shadow(0 0 100px #1a55ff) drop-shadow(0 0 250px #1a55ff);
      }

      /* 100%: Cycles cleanly back into the pure white baseline */
      100% {
        fill: #ffffff;
        filter: drop-shadow(0 0 40px rgba(255, 255, 255, 0.5));
      }
    }

  </style>
